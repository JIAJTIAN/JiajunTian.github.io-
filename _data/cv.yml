  - name: Soft materials and nanocellulose matrices
    keywords: "Self-assembly, hydrogels, collective dynamics, flow response, thermal behavior"
  - name: Functional nanocomposites for environmental applications
    keywords: "Nanoparticle formation, confined growth, contaminant removal, photocatalysis, structure-function relationships"
  - name: Element-specific and multiscale X-ray characterization
    keywords: "ASAXS/AWAXS, SAXS, WAXS, XPCS, complementary spectroscopy, physical modeling"

