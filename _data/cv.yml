        icon: fa-solid fa-water
        keywords: "Microfluidic integration, syringe- and pressure-driven flow, in situ UV-Vis, optical imaging, residence-time mapping, custom cells"
      - name: Engineering design and simulation
        icon: fa-solid fa-gears
        keywords: "Fusion 360, Blender, OpenFOAM, COMSOL, 3D-printable components, beamline-compatible sample environments"
