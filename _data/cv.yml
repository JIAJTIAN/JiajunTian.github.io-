cv:
  name: Jiajun Tian
  label: Postdoctoral Scholar at NSF's ChemMatCARS, APS Sector 15
  email: jiajtian@uchicago.edu
  location: Lemont, Illinois, United States
  image: ""
  summary: University of Chicago Postdoctoral Scholar at NSF's ChemMatCARS with experience in APS beamline commissioning, anomalous X-ray scattering, in situ and operando sample environments, controls integration, and automated data processing for dynamic soft and nanomaterials.

  social_networks:
    - network: GitHub
      username: JIAJTIAN

  sections:
    Experience:
      - company: University of Chicago / NSF's ChemMatCARS, APS Sector 15
        position: Postdoctoral Scholar
        location: Lemont, Illinois
        start_date: 2024-10
        end_date: present
        summary: Develop and commission beamline-integrated methods for anomalous X-ray scattering, multimodal in situ measurements, and dynamic nanomaterials characterization.
        highlights:
          - Develop an integrated continuous-flow microfluidic ASAXS/WAXS platform combining flow control, optical imaging, UV-Vis spectroscopy, X-ray detectors, and automated processing.
          - Contribute to ASAXS/AWAXS commissioning through detector and flight-tube installation, alignment, detector-geometry validation, and energy-dependent measurement workflows.
          - Commissioned an in situ UV-Vis spectroscopy capability and integrated it with X-ray scattering, optical imaging, and controlled flow.
          - Support user experiments from planning and sample-environment installation through alignment, acquisition, troubleshooting, reduction, and interpretation.
          - Develop Bluesky plans, a Queue Server client, HDF5 acquisition workflows, and FrameByFrame-ASWAXS reduction and analysis software.
          - Integrate and troubleshoot EPICS motors, area detectors, cameras, stages, triggering, metadata capture, and syringe- and pressure-driven flow controls.
          - Develop element-specific models for diselenide-containing liquid-crystal elastomers, contributing to a 2026 Chemistry of Materials publication.

      - company: Stony Brook University
        position: Graduate Research Assistant / Ph.D. Researcher
        location: Stony Brook, New York
        start_date: 2019-09
        end_date: 2024-10
        summary: Investigated nanocellulose assembly, dynamics, flow response, and functional composites using synchrotron and laboratory characterization.
        highlights:
          - Designed and interpreted XPCS experiments at NSLS-II CHX and APS 8-ID to quantify cellulose-nanocrystal self-assembly, aging, arrested-state behavior, and flow/rest dynamics.
          - Investigated metal-ion-cross-linked nanocellulose antifreezing behavior and nanoparticle formation in nanocellulose scaffolds using in situ SAXS/WAXS and complementary characterization.
          - Developed nanocellulose-based environmental-remediation composites, including ZnO-nanocellulose and nitro-oxidized CNF/carbon-nitride systems.
          - Operated TEM and SEM/EDS at Brookhaven's Center for Functional Nanomaterials and used cryo-TEM, DLS, zeta-potential measurements, and rheology.

      - company: Beijing University of Chemical Technology
        position: Master's Researcher
        location: Beijing, China
        start_date: 2016-09
        end_date: 2019-09
        summary: Developed cyanostilbene-based photoresponsive molecules and cholesteric liquid-crystal systems.
        highlights:
          - Designed a sunlight-driven liquid-crystal platform for real-time in situ ultraviolet monitoring.

    Education:
      - institution: Stony Brook University
        location: Stony Brook, New York
        area: Chemistry
        studyType: Ph.D.
        start_date: 2019-09
        end_date: 2024-08
        highlights:
          - Studied structure-dynamics-property relationships in nanocellulose-based functional materials using synchrotron SAXS, WAXS, and XPCS.
          - Degree conferred August 17, 2024; doctoral adviser Benjamin S. Hsiao.

      - institution: Beijing University of Chemical Technology
        location: Beijing, China
        area: Materials Engineering
        studyType: M.S.
        start_date: 2016-09
        end_date: 2019-09
        highlights:
          - Developed photoresponsive molecules, cholesteric liquid-crystal systems, and optical devices.

      - institution: Beijing University of Chemical Technology
        location: Beijing, China
        area: Polymer Materials and Engineering
        studyType: B.S.
        start_date: 2012-09
        end_date: 2016-09

